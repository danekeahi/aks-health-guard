# active-metrics-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: active-metrics-pod
  labels:
    job-name: my-fake-job
spec:
  containers:
  - name: cpu-burner
    image: busybox
    command: ["/bin/sh", "-c", "while true; do echo 'Running'; done"]
    resources:
      requests:
        cpu: "500m"
        memory: "300Mi"
      limits:
        cpu: "1000m"
        memory: "500Mi"
